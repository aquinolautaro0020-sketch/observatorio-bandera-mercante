name: Foto horaria del tráfico (AIS)

on:
  schedule:
    - cron: "17 * * * *"   # minuto 17 de cada hora (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: datos-observatorio
  cancel-in-progress: false

jobs:
  foto:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Escuchar AIS y guardar la foto
        run: python scripts/snapshot_ais.py
        env:
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
      - name: Publicar datos
        run: |
          git config user.name "observatorio-bot"
          git config user.email "observatorio-bot@users.noreply.github.com"
          git add data/snapshot.json data/historial.csv data/tipos_conocidos.json
          git diff --cached --quiet || git commit -m "Foto AIS $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase
          git push
